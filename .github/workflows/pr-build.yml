name: Go

on:
  pull_request:
    branches: [NewArc]
    types: [opened, ready_for_review]
  push:
    branches: [NewArc]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.23.6
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.6
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Get dependencies
        run: go mod download
      - name: Build
        run: make build
